services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: techma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
      POSTGRES_DB: techma_backend
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - backend-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techma -d techma_backend"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - backend-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  clamav:
    image: clamav/clamav:stable
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - backend-clamav:/var/lib/clamav
volumes:
  backend-postgres:
  backend-redis:
  backend-clamav:

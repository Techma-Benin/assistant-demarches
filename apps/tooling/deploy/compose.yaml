# Déploiement de test du Tooling : deux répliques derrière un proxy qui écarte
# celle qui n'est pas prête, une base PostgreSQL dédiée. Lancement depuis ce dossier :
#   cp tooling.env.example tooling.env   # puis renseigner les valeurs
#   TOOLING_DB_PASSWORD=… docker compose up -d --build
name: techma-tooling

x-tooling: &tooling
  build:
    context: ../../..
    dockerfile: apps/tooling/Dockerfile
  env_file: tooling.env
  environment:
    DATABASE_URL: postgres://tooling_owner:${TOOLING_DB_PASSWORD:?TOOLING_DB_PASSWORD requis}@tooling-db:5432/tooling
  # Le conteneur redémarre si le superviseur lui-même s'arrête.
  restart: unless-stopped
  init: true
  stop_grace_period: 20s
  depends_on:
    tooling-db:
      condition: service_healthy
  networks: [tooling]

services:
  tooling-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tooling
      POSTGRES_USER: tooling_owner
      POSTGRES_PASSWORD: ${TOOLING_DB_PASSWORD:?TOOLING_DB_PASSWORD requis}
    volumes:
      - tooling-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tooling_owner -d tooling"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [tooling]

  tooling-a: *tooling
  tooling-b: *tooling

  tooling-proxy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # Exposé en local seulement ; le Backend rejoint le réseau tooling en environnement de test.
    ports:
      - "127.0.0.1:4030:4030"
    restart: unless-stopped
    depends_on: [tooling-a, tooling-b]
    networks: [tooling]

volumes:
  tooling-db:

networks:
  tooling:
    name: techma-tooling
